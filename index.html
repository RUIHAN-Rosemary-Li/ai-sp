<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学口试训练系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 960px; margin: 0 auto; padding: 20px; }
.home-page { text-align: center; padding: 60px 20px; }
.home-page h1 { font-size: 28px; margin-bottom: 8px; }
.home-page .subtitle { color: #888; margin-bottom: 50px; font-size: 15px; }
.mode-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
.mode-card { background: #fff; border-radius: 16px; padding: 30px 20px; cursor: pointer; transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.mode-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.mode-card .icon { font-size: 48px; margin-bottom: 12px; }
.mode-card h3 { margin-bottom: 8px; }
.mode-card p { font-size: 14px; color: #666; line-height: 1.6; }
.history-btn { margin-top: 40px; padding: 10px 24px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 14px; }
.history-btn:hover { background: #f6f8fa; }

.settings-bar { position: fixed; top: 0; right: 0; padding: 12px; z-index: 100; }
.settings-btn { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
.settings-panel { display: none; position: fixed; top: 50px; right: 20px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.15); z-index: 101; width: 360px; }
.settings-panel.active { display: block; }
.settings-panel label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
.settings-panel input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.settings-panel button { margin-top: 16px; width: 100%; padding: 10px; background: #1677ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.settings-panel .notice { font-size: 12px; color: #888; margin-top: 8px; background: #f6f8fa; padding: 8px; border-radius: 6px; line-height: 1.6; }

.exam-page { display: none; }
.exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.exam-header h2 { font-size: 20px; }
.back-btn { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 6px 16px; cursor: pointer; }
.timer { font-size: 24px; font-weight: 700; color: #1677ff; }
.submit-diag-btn { padding: 8px 20px; background: #fa8c16; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
.submit-diag-btn:hover { background: #d87200; }

.config-bar { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.config-bar label { font-size: 14px; font-weight: 600; }
.config-bar select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }

.case-select { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.case-select .cs-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.case-select label.cs-label { font-size: 14px; font-weight: 600; min-width: 180px; line-height: 1.6; }
.case-select select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; min-width: 320px; height: 160px; }
.case-select button { margin-top: 12px; padding: 8px 20px; background: #1677ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }

.case-card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.case-card h3 { margin-bottom: 12px; color: #1677ff; }
.case-info { line-height: 1.8; }
.case-info p { margin-bottom: 6px; }
.case-info strong { display: inline-block; min-width: 84px; color: #555; }

.prep-phase { text-align: center; padding: 40px 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.prep-phase .countdown { font-size: 64px; font-weight: 700; color: #1677ff; margin: 20px 0; font-variant-numeric: tabular-nums; }

.qa-phase { display: none; }
.chat-history { max-height: 400px; overflow-y: auto; margin-bottom: 16px; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.chat-msg { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; max-width: 88%; font-size: 14px; line-height: 1.7; word-break: break-word; }
.chat-msg.examiner { background: #e6f4ff; margin-right: auto; border-left: 3px solid #1677ff; }
.chat-msg.student { background: #f6f8fa; margin-left: auto; text-align: right; border-right: 3px solid #52c41a; }
.chat-msg.feedback { background: #f9f0ff; margin-right: auto; border-left: 3px solid #722ed1; font-size: 9px !important; line-height: 1.5; }
.chat-msg.patient { background: #f0f9eb; margin-right: auto; border-left: 3px solid #52c41a; }
.question-box { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.question-box .question-label { font-size: 13px; color: #1677ff; font-weight: 600; margin-bottom: 8px; }
.question-box .question-text { font-size: 16px; line-height: 1.6; }

.record-area { text-align: center; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.record-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: #1677ff; color: #fff; font-size: 14px; cursor: pointer; transition: all .2s; user-select: none; -webkit-user-select: none; }
.record-btn.recording { background: #ff4d4f; animation: pulse 1.5s infinite; }
.record-btn:disabled { background: #ccc; cursor: not-allowed; animation: none; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.transcript { margin-top: 12px; padding: 12px; background: #f6f8fa; border-radius: 8px; font-size: 14px; min-height: 40px; text-align: left; white-space: pre-wrap; }
.text-fallback { margin-top: 12px; }
.text-fallback textarea { width: 100%; min-height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; }
.text-fallback button { margin-top: 8px; padding: 8px 20px; background: #1677ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }

.status-bar { text-align: center; padding: 8px; font-size: 13px; color: #888; }
.status-bar.error { color: #ff4d4f; }
.status-bar.ok { color: #52c41a; }

.score-panel { display: none; background: #fff; border-radius: 12px; padding: 24px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.score-panel h3 { margin-bottom: 16px; }
.score-panel .score-actions { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.score-panel .score-actions button { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.edit-btn { background: #faad14; color: #fff; }
.export-btn { background: #52c41a; color: #fff; }
.export-html-btn { background: #722ed1; color: #fff; }
.edit-area { margin-top: 12px; display: none; }
.edit-area textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
.score-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.score-item .points { color: #1677ff; font-weight: 700; }
.score-detail { margin-top: 16px; padding: 16px; background: #f6f8fa; border-radius: 8px; font-size: 14px; line-height: 1.8; }
.score-detail h4 { color: #1677ff; margin-bottom: 8px; }
.score-detail .q-section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed #ddd; }
.score-detail .q-section:last-child { border-bottom: none; }
.score-detail .std-ans { background: #e6f4ff; padding: 8px 12px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap; }
.score-detail .missed { background: #fff1f0; padding: 8px 12px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap; }
.score-detail .feedback-text { background: #f9f0ff; padding: 8px 12px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap; }

/* 历史简介编辑区 */
.history-summary-edit { margin-top: 16px; padding: 16px; background: #fff7e6; border-radius: 8px; border: 1px solid #ffd591; }
.history-summary-edit label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #d87200; }
.history-summary-edit textarea { width: 100%; min-height: 60px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; }
.history-summary-edit button { margin-top: 8px; padding: 6px 16px; background: #fa8c16; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }

.loading-mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.3); z-index: 200; align-items: center; justify-content: center; }
.loading-mask.active { display: flex; }
.loading-box { background: #fff; border-radius: 12px; padding: 30px 40px; text-align: center; }
.loading-box .spinner { width: 40px; height: 40px; border: 4px solid #e8e8e8; border-top-color: #1677ff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.history-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; }
.history-panel.active { display: flex; }
.history-box { background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto; }
.history-box h3 { margin-bottom: 16px; }
.history-item { background: #f6f8fa; border-radius: 8px; padding: 16px 40px 16px 16px; margin-bottom: 12px; border-left: 4px solid #1677ff; cursor: pointer; transition: background .2s; position: relative; }
.history-item:hover { background: #e6f4ff; }
.history-item .history-meta { font-size: 12px; color: #888; margin-bottom: 4px; }
.history-item .history-summary { font-size: 13px; color: #555; line-height:   1.5; }
/* 右上：删除小叉 */
.history-item .del-btn { position: absolute; top: 6px; right: 10px; width: 22px; height: 22px; border: none; background: transparent; color: #ccc; font-size: 18px; line-height: 1; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all .2s; padding: 0; }
.history-item .del-btn:hover { background: #ff4d4f; color: #fff; }
/* 右下：小箭头 → 进入完整结果 */
.history-item .arrow-btn { position: absolute; bottom: 6px; right: 12px; border: none; background: transparent; color: #ccc; font-size: 16px; cursor: pointer; transition: color .2s; padding: 2px 6px; }
.history-item .arrow-btn:hover { color: #1677ff; }
.history-item .history-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; }
.history-item .history-detail.active { display: block; }
.history-item .history-detail .detail-summary { font-size: 13px; line-height: 1.7; background: #fff; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
.close-history { margin-top: 16px; padding: 8px 24px; background: #888; color: #fff; border: none; border-radius: 8px; cursor: pointer; }

.diag-input-mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; }
.diag-input-mask.active { display: flex; }
.diag-input-box { background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 600px; }
.diag-input-box h3 { margin-bottom: 12px; }
.diag-input-box textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; }
.diag-input-box .diag-btns { margin-top: 12px; display: flex; gap: 12px; justify-content: flex-end; }
.diag-input-box .diag-btns button { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.diag-submit { background: #1677ff; color: #fff; }
.diag-cancel { background: #ddd; color: #333; }
/* ===== 移动端适配 & 新增样式 ===== */
.text-fallback textarea { min-height: 90px; }
.draft-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.draft-btns button { padding: 9px 18px; background: #1677ff; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.draft-btns button.ghost { background: #fff; color: #555; border: 1px solid #ddd; }
.err-box { display: none; background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; color: #cf1322; }
.err-box.active { display: block; }
.js-error { position: fixed; left: 0; right: 0; top: 0; z-index: 9999; background: #cf1322; color: #fff; font: 12px/1.5 -apple-system, "PingFang SC", sans-serif; padding: 8px 12px; word-break: break-all; }
@media (max-width: 640px) {
  .container { padding: 12px; }
  .settings-panel { width: calc(100vw - 24px); right: 12px; top: 46px; }
  .home-page { padding: 46px 12px; }
  .home-page h1 { font-size: 22px; }
  .mode-card { padding: 20px 16px; }
  .case-select .cs-row { flex-direction: column; gap: 8px; }
  .case-select label.cs-label { min-width: 0; }
  .case-select select { min-width: 0; width: 100%; height: 140px; }
  .exam-header { margin-top: 34px; }
  .chat-history { max-height: 42vh; }
  .record-btn { width: 96px; height: 96px; }
  .prep-phase .countdown { font-size: 48px; }
  .history-box { width: calc(100vw - 24px); padding: 16px; }
  .score-panel { padding: 16px; }
  .question-box { padding: 14px 16px; }
}
.mic-help { margin-top: 10px; }
.mic-help button { padding: 8px 16px; background: #fff; color: #1677ff; border: 1px solid #1677ff; border-radius: 8px; font-size: 14px; cursor: pointer; }
.mic-help .mic-help-text { margin-top: 6px; font-size: 12px; color: #999; line-height: 1.6; }
</style>
</head>
<body>
<script>
// 脚本错误/请求错误直接显示在页面顶部，手机上也能看到，便于排查
(function () {
  function banner(text) {
    try {
      var d = document.createElement('div');
      d.className = 'js-error';
      d.textContent = text;
      document.body.appendChild(d);
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    banner('页面脚本出错：' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    banner('页面请求出错：' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
<div class="loading-mask" id="loadingMask"><div class="loading-box"><div class="spinner"></div><div id="loadingText">请稍候...</div></div></div>

<div class="history-panel" id="historyPanel">
  <div class="history-box">
    <h3>📋 历史记录</h3>
    <div id="historyList"></div>
    <button class="close-history" onclick="closeHistory()">关闭</button>
  </div>
</div>

<div class="diag-input-mask" id="diagInputMask">
  <div class="diag-input-box">
    <h3>📝 提交你的诊断</h3>
    <p style="font-size:13px;color:#666;margin-bottom:12px;">请根据问诊信息，写出你认为的完整诊断</p>
    <textarea id="diagInputText" placeholder="例如：COPD急性加重期..."></textarea>
    <div class="diag-btns">
      <button class="diag-cancel" onclick="closeDiagInput()">取消</button>
      <button class="diag-submit" onclick="submitDiagnosis()">提交诊断</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="settings-bar"><button class="settings-btn" onclick="toggleSettings()">⚙ 设置</button></div>
  <div class="settings-panel" id="settingsPanel">
    <label>API 地址</label>
    <input type="text" id="apiUrl" value="/api/generate" />
    <label>模型名称</label>
    <input type="text" id="modelName" value="deepseek-chat" />
    <div class="notice">严格程度请在口试模式的工具栏中选择。</div>
    <button onclick="saveSettings()">保存</button>
  </div>

  <div class="home-page" id="homePage">
    <h1>🩺 医学口试训练系统</h1>
    <p class="subtitle">病种驱动 · 本地关键词匹配（秒回）· AI深度追问 · 自动保存</p>
    <div class="mode-cards">
      <div class="mode-card" onclick="startMode('interview')"><div class="icon">🩹</div><h3>问诊打分</h3><p>选病种→AI扮演患者→你一步步问诊→提交诊断→AI评分</p></div>
      <div class="mode-card" onclick="startMode('oral_practice')"><div class="icon">📝</div><h3>口试练习</h3><p>选科室/难度→AI生成病例→5分钟准备→三连问→追问引导</p></div>
      <div class="mode-card" onclick="startMode('oral_exam')"><div class="icon">🎓</div><h3>口试模考</h3><p>选科室/难度→严格评分→追问犀利→详细解答</p></div>
    </div>
    <button class="history-btn" onclick="showHistory()">📋 查看历史记录</button>
  </div>

  <div class="exam-page" id="examPage">
    <div class="exam-header">
      <button class="back-btn" onclick="backHome()">← 返回</button>
      <h2 id="examTitle"></h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="timer" id="timer"></div>
        <button class="submit-diag-btn" id="submitDiagBtn" onclick="openDiagInput()" style="display:none;">📋 提交诊断</button>
      </div>
    </div>
    <div class="config-bar" id="configBar"></div>
    <div class="err-box" id="errBox"><h4 id="errTitle">⚠ 请求出错</h4><div class="err-msg" id="errMsg"></div></div>
    <div class="case-select" id="caseSelect"></div>
    <div id="caseDisplay"></div>
    <div class="prep-phase" id="prepPhase"></div>
    <div class="qa-phase" id="qaPhase">
      <div class="chat-history" id="chatHistory"></div>
      <div class="question-box" id="questionBox" style="display:none;">
        <div class="question-label">当前问题</div>
        <div class="question-text" id="questionText"></div>
      </div>
      <div class="record-area">
        <button class="record-btn" id="recordBtn" ontouchstart="event.preventDefault();startRecord()" ontouchend="event.preventDefault();stopRecord()" onmousedown="startRecord()" onmouseup="stopRecord()" onmouseleave="stopRecord()" oncontextmenu="return false">按住<br>说话</button>
                <div class="mic-help" id="micHelp" style="display:none;">
          <button onclick="requestMicPermission()">🔓 开启麦克风权限</button>
          <div class="mic-help-text">一直提示"麦克风不可用"时，点这里并按浏览器提示允许</div>
        </div><div class="transcript" id="transcript"></div>
        <div class="text-fallback" id="textFallback"></div>
      </div>
      <div class="status-bar" id="statusBar">就绪</div>
    </div>
    <div class="score-panel" id="scorePanel">
      <h3 id="scorePanelTitle">📊 结果</h3>
      <div id="scoreItems"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="score-actions">
        <button class="edit-btn" onclick="toggleEdit()">✏️ 编辑结果</button>
        <button class="export-btn" onclick="exportResult()">📤 导出文本</button>
        <button class="export-html-btn" onclick="exportHTML()">📄 导出HTML</button>
        <button class="next-btn" onclick="nextCase()" style="background:#1677ff;color:#fff;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;">下一个</button>
        <button class="next-btn" onclick="backHome()" style="background:#888;color:#fff;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;">返回主页</button>
      </div>
      <div class="edit-area" id="editArea"><textarea id="editText"></textarea><button onclick="saveEdit()" style="margin-top:8px;padding:8px 20px;background:#1677ff;color:#fff;border:none;border-radius:8px;cursor:pointer;">保存编辑</button></div>
      <div class="history-summary-edit" id="historySummaryEdit" style="display:none;">
        <label>📝 编辑历史简介（将显示在历史记录列表中）</label>
        <textarea id="historySummaryText"></textarea>
        <button onclick="saveHistorySummary()">保存简介</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============ 病种数据库 ============

function localKeywordCheck(answerText) {
  const answer = answerText.toLowerCase();
  const ds = DIAGNOSIS_SET[currentDisease] || { keywords: [currentDisease.toLowerCase()], comorbidities_kw: [], complications_kw: [], subtype_kw: [] };

  // 根据设置决定是否考核合并症/并发症
  const wantComorb = settings.wantComorbidities !== false;
  const wantComp = settings.wantComplications !== false;
  const comorbKw = wantComorb ? ds.comorbidities_kw : [];
  const compKw = wantComp ? ds.complications_kw : [];

  let hitMain = 0, totalMain = ds.keywords.length;
  let hitComorb = 0, totalComorb = comorbKw.length;
  let hitComp = 0, totalComp = compKw.length;
  let hitSub = 0, totalSub = ds.subtype_kw.length;

  ds.keywords.forEach(k => { if (answer.includes(k.toLowerCase())) hitMain++; });
  comorbKw.forEach(k => { if (answer.includes(k.toLowerCase())) hitComorb++; });
  compKw.forEach(k => { if (answer.includes(k.toLowerCase())) hitComp++; });
  ds.subtype_kw.forEach(k => { if (answer.includes(k.toLowerCase())) hitSub++; });

  const strictness = settings.strictness || 'medium';
  let passThreshold = strictness === 'lenient' ? 0.15 : strictness === 'medium' ? 0.3 : 0.5;

  const mainRatio = totalMain > 0 ? hitMain / totalMain : 0;
  // 关闭某项时按权重重分配：把该项权重并给主诊断，避免关掉后更难通过
  let comorbRatio = totalComorb > 0 ? hitComorb / totalComorb : 1;
  let compRatio = totalComp > 0 ? hitComp / totalComp : 1;
  const subRatio = totalSub > 0 ? hitSub / totalSub : 1;

  let weightedScore;
  if (!wantComorb && !wantComp) {
    weightedScore = mainRatio * 0.84 + subRatio * 0.16;
  } else if (!wantComorb) {
    weightedScore = mainRatio * 0.67 + compRatio * 0.17 + subRatio * 0.16;
  } else if (!wantComp) {
    weightedScore = mainRatio * 0.67 + comorbRatio * 0.17 + subRatio * 0.16;
  } else {
    weightedScore = mainRatio * 0.5 + comorbRatio * 0.17 + compRatio * 0.17 + subRatio * 0.16;
  }
  const passed = weightedScore >= passThreshold;

  let missedKws = [];
  if (mainRatio < 0.5) ds.keywords.forEach(k => { if (!answer.includes(k.toLowerCase())) missedKws.push(k); });
  if (wantComorb && comorbRatio < 0.5) comorbKw.forEach(k => { if (!answer.includes(k.toLowerCase())) missedKws.push(k); });
  if (wantComp && compRatio < 0.5) compKw.forEach(k => { if (!answer.includes(k.toLowerCase())) missedKws.push(k); });

  const isDeepQuestion = currentQuestionIndex >= 1;
  let maxFollowUps = 0;
  if (strictness === 'lenient') maxFollowUps = 0;
  else if (strictness === 'medium') maxFollowUps = isDeepQuestion ? 2 : 1;
  else maxFollowUps = isDeepQuestion ? 3 : 2;

  return { passed, score: Math.round(weightedScore * 100), missedKws: missedKws.slice(0, 5), maxFollowUps, weightedScore };
}

async function requestMicPermission(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('这个浏览器不支持网页录音。\n请换用 Chrome / Safari 打开；或直接点下方输入框，用输入法的 🎤 语音输入。');
    return;
  }
  setStatus('正在请求麦克风权限...', false, false);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(function (t) { t.stop(); });
    hideMicHelp();
    setStatus('麦克风已授权，按住「说话」即可', false, true);
  } catch (e) {
    const n = (e && e.name) || '';
    let msg;
    if (n === 'NotAllowedError' || n === 'SecurityError') {
      msg = '浏览器拒绝了麦克风权限。\n\n'
        + '1. 点地址栏左侧的 🔒 或 ⚙ →「权限」→ 麦克风 → 允许，然后刷新页面\n'
        + '2. 手机系统里也要允许浏览器用麦克风：设置 → 应用 → 浏览器 → 权限 → 麦克风\n'
        + '3. 如果是在微信里打开的：点右上角「⋯」→「在浏览器中打开」';
    } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
      msg = '没有找到麦克风设备。';
    } else if (n === 'NotReadableError') {
      msg = '麦克风被其他应用占用（比如正在通话/录音），关掉后重试。';
    } else {
      msg = '开启麦克风失败：' + ((e && e.message) || n);
    }
    alert(msg);
    setStatus('麦克风不可用，请按提示在浏览器里允许麦克风', true, false);
    showMicHelp();
  }
}

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { speechSupported = false; showTextFallback(); return false; }
  if (recognition) { speechSupported = true; return true; }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'zh-CN';
  speechSupported = true;

  recognition.onstart = () => { setStatus('语音识别中...', false, false); };

  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) recogResults[i] = res[0].transcript;
      else interimTranscript = res[0].transcript;
    }
    finalTranscript = Object.keys(recogResults)
      .map(Number).sort((a, b) => a - b)
      .map(k => recogResults[k]).join('');
    renderTranscriptLive();
  };

  recognition.onerror = (e) => {
    const err = (e && e.error) ? e.error : 'unknown';
    if (err === 'no-speech' || err === 'aborted') return;
    if (err === 'network' || err === 'service-not-allowed' || err === 'language-not-supported') {
      recogWanted = false; isRecording = false; updateRecordBtn();
      const el = transcriptEl();
      if (el) el.textContent = '⚠ 浏览器自带的语音服务连不上（' + err + '），请直接打字，或用输入法自带的语音输入';
      setStatus('语音服务不可用，请改用文字输入', true, false);
      return;
    }
    if (err === 'not-allowed' || err === 'audio-capture') {
      recogWanted = false; isRecording = false; updateRecordBtn();
      const el3 = transcriptEl();
      if (el3) el3.textContent = '⚠ 麦克风不可用。先点下方「🔓 开启麦克风权限」，按浏览器提示点「允许」；仍不行请换 Chrome / Safari 打开，或直接用输入法语音输入。';
      setStatus('麦克风不可用：可点下方按钮重新授权', true, false);
      showMicHelp();
      return;
    }
    setStatus('语音识别出错（' + err + '），可改用文字输入', true, false);
  };

  recognition.onend = () => {
    if (!recogWanted) { isRecording = false; updateRecordBtn(); return; }
    if (recogRestarts < 20) {
      recogRestarts++;
      clearTimeout(recogRestartTimer);
      recogRestartTimer = setTimeout(() => { if (recogWanted) { try { recognition.start(); } catch (e) {} } }, 250);
      return;
    }
    recogWanted = false; isRecording = false; updateRecordBtn();
    finishRecognition();
  };
  return true;
}

function startRecord() {
  if (isWaitingForAI) return;
  if (!speechSupported && !initSpeechRecognition()) {
    showTextFallback();
    setStatus('这个浏览器不支持语音识别，请直接在下方打字，或用输入法的语音输入', true, false);
    return;
  }
  if (isRecording) return;
  isRecording = true; recogWanted = true; recogRestarts = 0;
  finalTranscript = ''; interimTranscript = ''; recogResults = {};
  const el = transcriptEl(); if (el) el.textContent = '🎤 聆听中...';
  updateRecordBtn();
  try {
    recognition.start();
  } catch (e) {
    setTimeout(() => {
      if (!recogWanted) return;
      try { recognition.start(); }
      catch (e2) {
        isRecording = false; recogWanted = false; updateRecordBtn();
        setStatus('麦克风启动失败，请重试', true, false);
      }
    }, 300);
  }
}

function stopRecord() {
  if (!isRecording) return;
  isRecording = false; recogWanted = false; updateRecordBtn();
  clearTimeout(recogRestartTimer);
  try { if (recognition) recognition.stop(); } catch (e) {}
  setTimeout(finishRecognition, 700);
}

function finishRecognition() {
  const text = (finalTranscript + interimTranscript).trim();
  const ta = draftEl();
  if (ta) ta.value = text;
  const el = transcriptEl();
  if (el) el.textContent = text ? text + '（可修改后提交）' : '⚠ 没识别到内容，请重试或直接打字';
  setStatus(text ? '识别完成，确认或修改后点「提交答案」' : '未识别到语音', !text, !!text);
}

async function polishDraft() {
  const ta = document.getElementById('answerDraft');
  if (!ta || !ta.value.trim()) { alert('先说话或输入内容'); return; }
  if (isWaitingForAI) return;
  isWaitingForAI = true;
  const raw = ta.value.trim();
  setStatus('正在纠正同音错字...', false, false);
  try {
    const prompt = '下面是医学生口述答案的语音识别结果，可能有同音错字。请只修正明显的同音错字和缺少的标点，'
      + '不要增加、删除、改写任何信息，保持原意，直接输出修正后的文字，不要解释：\n' + raw;
    const r = await fetch(settings.apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: settings.modelName, messages: [{ role: 'user', content: prompt }], temperature: 0.1 }) });
    const rawText = await r.text();
    let d; try { d = JSON.parse(rawText); } catch (e) { throw new Error('接口返回异常（HTTP ' + r.status + '）'); }
    if (!r.ok || (d && d.error)) throw new Error((d && d.error && (d.error.message || d.error)) || ('HTTP ' + r.status));
    const fixed = ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '').trim();
    if (fixed) ta.value = fixed.replace(/^["“]|["”]$/g, '');
    const el = transcriptEl(); if (el) el.textContent = ta.value;
    setStatus('已纠错，可再手动修改', false, true);
  } catch (e) {
    setStatus('纠错失败：' + e.message, true, false);
  } finally {
    isWaitingForAI = false;
  }

// ============ 口试模式 ============
async function processStudentAnswer(answerText) {
  if(isWaitingForAI)return;
  const q=QUESTION_SEQUENCE[currentQuestionIndex];
  const isFollowUpReply=followUpCount>0&&followUpContext;
  const localResult=localKeywordCheck(answerText);

  // 宽松模式：直接过
  if(settings.strictness==='lenient'){
    studentAnswers[currentQuestionIndex]=answerText;
    if(!localResult.passed) addChatMsg('feedback','（回答已记录，继续下一问）');
    currentQuestionIndex++; followUpCount=0; followUpContext=''; followUpQuestion='';
    if(currentQuestionIndex<QUESTION_SEQUENCE.length){askCurrentQuestion();setStatus('就绪',false,true);}else finishExam();
    return;
  }

  // 中等/严格模式：本地关键词匹配通过 且 非追问中 → 直接过
  if(localResult.passed && followUpCount===0){
    addChatMsg('feedback','✅ 要点覆盖到位，继续。');
    studentAnswers[currentQuestionIndex]=answerText;
    currentQuestionIndex++; followUpCount=0; followUpContext=''; followUpQuestion='';
    if(currentQuestionIndex<QUESTION_SEQUENCE.length){askCurrentQuestion();setStatus('就绪',false,true);}else finishExam();
    return;
  }

  // 需要AI判断（部分覆盖 或 追问中）
  isWaitingForAI=true; const btn=document.getElementById('recordBtn'); if(btn)btn.disabled=true;
  setStatus('🤔 AI 分析中...',false,false);

  let contextBlock='';
  if(isFollowUpReply) contextBlock=`这是追问后的补充。前文：学生上一轮="${followUpContext}"，追问="${followUpQuestion}"，补充="${answerText}"。综合评估。`;

  // 硬约束 prompt：把「可省略」改成「必须」，仅满分才可空
  const prompt=`你是严格的医学口试考官。病种：${currentDisease}。问题：${q.label}。学生回答："${answerText}"。${contextBlock}
要求：
1. 不纠结回答顺序，点到要点即可
2. 搭边就放行，不要过度追问
3. 追问上限${localResult.maxFollowUps}轮（当前${followUpCount}/${localResult.maxFollowUps}）
4. 提示极简一句话，苏格拉底式引导，不剧透
5. 对试探性回答给予肯定+引导补充
6. 仅当回答完全满分(passed且score>=90)时 follow_up 才可为空字符串；其余情况必须给一条具体追问，禁止省略本字段
7. 必须只输出如下严格 JSON，不要输出任何额外文字、不要使用 Markdown 代码块

{"score":0-100,"is_on_topic":true或false,"feedback":"极简点评","follow_up":"追问一句话，无追问则为空字符串"}`;

  // 解析AI结果，失败自动重试一次
  async function callAndParse(){
    const r=await fetch(settings.apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:settings.modelName,messages:[{role:"user",content:prompt}],temperature:0.3})});
    const data=await r.json(); if(!r.ok)throw new Error((data.error&&data.error.message)||('HTTP'+r.status));
    const raw=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'';
    const cleaned=raw.replace(/```json?\s*/gi,'').replace(/```/g,'').trim();
    let a=null;
    try{ a=JSON.parse(cleaned); }catch(e){
      const m=cleaned.match(/\{[\s\S]*\}/);
      if(m) try{ a=JSON.parse(m[0]); }catch(e2){ a=null; }
    }
    console.log('[追问调试] raw:', raw.slice(0,400), '| parsed:', JSON.stringify(a), '| follow_up:', a&&a.follow_up);
    if(!a||typeof a.score==='undefined') throw new Error('AI返回格式异常');
    return a;
  }

  let analysis=null;
  try{
    try{
      analysis=await callAndParse();
    }catch(firstErr){
      console.warn('AI首次解析失败，重试一次...', firstErr);
      try{ analysis=await callAndParse(); }catch(e2){ throw firstErr; } // 重试仍失败则用首次错误
    }

    if(analysis.feedback) addChatMsg('feedback','📋 '+analysis.feedback);

    // 不搭边：放行进入下一问
    if(analysis.is_on_topic===false){
      studentAnswers[currentQuestionIndex]=answerText;
      currentQuestionIndex++; followUpCount=0; followUpContext=''; followUpQuestion='';
      if(currentQuestionIndex<QUESTION_SEQUENCE.length){askCurrentQuestion();setStatus('就绪',false,true);}else finishExam();
      return;
    }

    // 判定是否需要追问：未过阈值 或 得分<90 → 需要追问；未达上限才执行
    const wantFollowUp = !localResult.passed || (analysis.score||0) < 90;

    if(wantFollowUp && followUpCount<localResult.maxFollowUps){
      let fu=String(analysis.follow_up||'').trim();
      // 本地兜底：AI没返回追问时，按关键词缺口生成一条
      if(!fu){
        const ds=DIAGNOSIS_SET[currentDisease]||{};
        const missed=(localResult.missedKws&&localResult.missedKws.length)?localResult.missedKws[0]:'';
        const fallback=[
          missed?`你提到了${missed}，还有哪些关键点没有覆盖？`:'这个回答还有哪些方面可以补充？',
          '如果再进一步深入，你会从哪个角度展开？',
          '结合这个病例，你怎么向患者解释你的判断依据？'
        ];
        fu=fallback[followUpCount%fallback.length];
      }
      followUpContext=answerText; followUpQuestion=fu; followUpCount++;
      addChatMsg('examiner','🔍 '+fu);
      setStatus('请补充',false,false); isWaitingForAI=false; if(btn)btn.disabled=false; return;
    }

    // 不需要追问或已达上限 → 进入下一问
    followUpCount=0; followUpContext=''; followUpQuestion='';
    studentAnswers[currentQuestionIndex]=answerText;
    currentQuestionIndex++;
    if(currentQuestionIndex<QUESTION_SEQUENCE.length){askCurrentQuestion();setStatus('就绪',false,true);}else finishExam();
  }catch(e){
    console.error('AI分析失败，使用本地兜底：', e);
    addChatMsg('feedback','⚠ 网络/模型异常，已使用本地规则继续。');
    // 异常兜底：未过阈值且有追问次数 → 本地追问；否则放行
    if(!localResult.passed && followUpCount<localResult.maxFollowUps){
      const ds=DIAGNOSIS_SET[currentDisease]||{};
      const missed=(localResult.missedKws&&localResult.missedKws.length)?localResult.missedKws[0]:'';
      const fu=missed?`关于${missed}，你还能补充什么？`:'这个回答还有哪些要点可以继续完善？';
      followUpContext=answerText; followUpQuestion=fu; followUpCount++;
      addChatMsg('examiner','🔍 '+fu);
      setStatus('请补充',false,false); isWaitingForAI=false; if(btn)btn.disabled=false; return;
    }
    studentAnswers[currentQuestionIndex]=answerText;
    currentQuestionIndex++; followUpCount=0; followUpContext=''; followUpQuestion='';
    if(currentQuestionIndex<QUESTION_SEQUENCE.length)askCurrentQuestion();else finishExam();
  }finally{isWaitingForAI=false;if(btn)btn.disabled=false;}
}

// ============ 历史 ============
function saveHistoryAndReturnIndex(type,data){
  let h=JSON.parse(localStorage.getItem('sp_history')||'[]');
  h.unshift({type,data,savedAt:new Date().toISOString()});
  if(h.length>50)h=h.slice(0,50);
  localStorage.setItem('sp_history',JSON.stringify(h));
  return 0; // 刚unshift的在最前面
}

function saveHistory(type,data){saveHistoryAndReturnIndex(type,data);}

function deleteHistory(idx,e){
  e.stopPropagation();
  let h=JSON.parse(localStorage.getItem('sp_history')||'[]');
  h.splice(idx,1);
  localStorage.setItem('sp_history',JSON.stringify(h));
  showHistory();
}

function showHistorySummaryEdit(currentSummary){
  const editDiv=document.getElementById('historySummaryEdit');
  document.getElementById('historySummaryText').value=currentSummary||'';
  editDiv.style.display='block';
}

function saveHistorySummary(){
  const newSummary=document.getElementById('historySummaryText').value.trim();
  if(!newSummary||currentHistoryIndex<0)return;
  let h=JSON.parse(localStorage.getItem('sp_history')||'[]');
  if(h[currentHistoryIndex]){
    h[currentHistoryIndex].data.summary=newSummary;
    h[currentHistoryIndex].data.shortSummary=newSummary;
    localStorage.setItem('sp_history',JSON.stringify(h));
  }
  document.getElementById('historySummaryEdit').style.display='none';
  setStatus('简介已保存',false,true);
}

function showHistory(){
  const list=document.getElementById('historyList');const h=JSON.parse(localStorage.getItem('sp_history')||'[]');
  if(!h.length){list.innerHTML='<p style="text-align:center;color:#888;padding:40px;">暂无记录</p>';}else{
    let html='';
    h.forEach((item,idx)=>{
      if(item.type==='interview'){
        const d=item.data||{};
        const summary=d.summary||`问诊评分 ${d.score}/100`;
        const diag=(d.studentDiag||'').substring(0,80)+(d.studentDiag&&d.studentDiag.length>80?'...':'');
        html+=`<div class="history-item" onclick="toggleHistoryDetail(${idx})">
          <button class="del-btn" onclick="deleteHistory(${idx},event)" title="删除">×</button>
          <div class="history-meta">${d.time||''} · 问诊 · ${d.disease||''} · ${d.score!=null?d.score+'/100':''}</div>
          <div class="history-summary">${summary}</div>
          <div class="history-detail" id="histDetail${idx}">
            <div class="detail-summary"><strong>诊断：</strong>${diag}<br><strong>综合点评：</strong>${d.overallFeedback||''}</div>
            <button class="arrow-btn" onclick="gotoHistoryResult(${idx});event.stopPropagation();" title="进入完整结果">→</button>
          </div>
        </div>`;
      }else{
        const d=item.data||{};
        const avgScore=d.scores&&d.scores.length?Math.round(d.scores.reduce((a,s)=>a+s.score,0)/d.scores.length):'?';
        const summary=d.summary||d.shortSummary||`口试评分 ${avgScore}/100，${d.disease||''}`;
        let answersPreview='';
        if(d.studentAnswers) d.studentAnswers.slice(0,2).forEach((a,i)=>{answersPreview+=`第${i+1}问：${(a||'未答').substring(0,40)}${a&&a.length>40?'...':''}\n`;});
        html+=`<div class="history-item" onclick="toggleHistoryDetail(${idx})">
          <button class="del-btn" onclick="deleteHistory(${idx},event)" title="删除">×</button>
          <div class="history-meta">${d.time||''} · 口试 · ${d.disease||''} · 均分${avgScore}</div>
          <div class="history-summary">${summary}</div>
          <div class="history-detail" id="histDetail${idx}">
            <div class="detail-summary"><strong>病例：</strong>${d.caseTitle||'病例'}<br><pre style="font-size:12px;white-space:pre-wrap;margin-top:4px;">${answersPreview}</pre></div>
            <button class="arrow-btn" onclick="gotoHistoryResult(${idx});event.stopPropagation();" title="进入完整结果">→</button>
          </div>
        </div>`;
      }
    });
    list.innerHTML=html;
  }
  document.getElementById('historyPanel').classList.add('active');
}

function toggleHistoryDetail(idx){
  const el=document.getElementById('histDetail'+idx);
  if(el)el.classList.toggle('active');
}

function gotoHistoryResult(idx){
  try{
    const h=JSON.parse(localStorage.getItem('sp_history')||'[]');
    if(!h[idx]){ setStatus('记录已损坏',true,false); return; }
    const item=h[idx];
    if(!item||!item.data){ setStatus('记录数据缺失',true,false); return; }
    const d=item.data||{};
    closeHistory();

    // 切换到结果视图：只显示评分面板，隐藏其他阶段
    document.getElementById('homePage').style.display='none';
    document.getElementById('examPage').style.display='block';
    document.getElementById('scorePanel').style.display='block';
    document.getElementById('qaPhase').style.display='none';
    document.getElementById('caseSelect').style.display='none';
    document.getElementById('prepPhase').style.display='none';
    document.getElementById('configBar').style.display='none';
    document.getElementById('questionBox').style.display='none';
    document.getElementById('caseDisplay').innerHTML='';
    document.getElementById('submitDiagBtn').style.display='none';
    document.getElementById('historySummaryEdit').style.display='none';
    document.getElementById('examTitle').textContent=item.type==='interview'?'问诊评分（历史）':'口试结果（历史）';

    if(item.type==='interview'){
      document.getElementById('scorePanelTitle').textContent='📋 问诊评分（历史记录）';
      const dNames={"history_taking":"现病史要素","basic_info":"基本信息","other_history":"其他史","diff_questions":"鉴别提问","humanity":"人文关怀","logic":"问诊逻辑"};
      let scoresHtml=`<div class="score-item"><span>🏆 总分</span><span class="points">${d.score!=null?d.score+'/100':'-'}</span></div>`;
      for(const[k,v]of Object.entries(d.dimensionScores||{})){
        scoresHtml+=`<div class="score-item"><span>${dNames[k]||k}</span><span class="points">${v}/100</span></div>`;
      }
      document.getElementById('scoreItems').innerHTML=scoresHtml;
      let detail='';
      for(const[k,v]of Object.entries(d.dimensionComments||{})){
        if(v) detail+=`<div class="q-section"><h4>${dNames[k]||k}</h4><p>${v}</p></div>`;
      }
      detail+=`<div class="q-section"><h4>💬 综合点评</h4><p>${d.overallFeedback||''}</p></div>`;
      detail+=`<div class="q-section"><h4>📖 标准诊断</h4><p>${d.stdDiag||''}</p></div>`;
      detail+=`<div class="q-section"><h4>📝 学生诊断</h4><p>${d.studentDiag||''}</p></div>`;
      document.getElementById('scoreDetail').innerHTML=detail;
    }else{
      const d=item.data;
      document.getElementById('scorePanelTitle').textContent='📋 口试结果（历史记录）';
      let scoresHtml='';
      (d.scores||[]).forEach(s=>{scoresHtml+=`<div class="score-item"><span>${s.question||''}</span><span class="points">${s.score!=null?s.score+'/100':'-'}</span></div>`;});
      document.getElementById('scoreItems').innerHTML=scoresHtml;
      let detail='';
      if(d.studentAnswers){
        d.studentAnswers.forEach((a,i)=>{
          detail+=`<div class="q-section"><h4>第${i+1}问</h4><div style="background:#f0f0f0;padding:8px 12px;border-radius:6px;margin:6px 0;"><strong>你的回答：</strong>\n${a||'（未答）'}</div></div>`;
        });
      }
      detail+=`<div class="q-section"><h4>📝 综合点评</h4><p>${d.summary||''}</p></div>`;
      document.getElementById('scoreDetail').innerHTML=detail;
    }

    currentHistoryIndex=idx;
    showHistorySummaryEdit(d.summary||d.shortSummary||'');
    setStatus('已加载历史结果',false,true);
  }catch(e){
    console.error('gotoHistoryResult error:', e);
    setStatus('加载历史结果失败：'+e.message, true, false);
  }
}

function closeHistory(){document.getElementById('historyPanel').classList.remove('active');}

// ============ 页面逻辑 ============
function normalizeApiUrl(u){
  u=String(u||'').trim();
  if(!u) return '/api/generate';
  // 只有页面本身部署在线上时，才把旧的本机地址自动纠正为同源接口
  const localPage=/^(localhost|127\.0\.0\.1)?$/i.test(location.hostname)||location.protocol==='file:';
  if(!localPage&&/(^|\/\/)(localhost|127\.0\.0\.1|0\.0\.0\.0)(:|\/|$)/i.test(u)) return '/api/generate';
  return u;
}
function normalizeModelName(m){
  m=String(m||'').trim();
  // 旧默认值 deepseek/deepseek-flash 带厂商前缀，官方接口不认
  if(!m||m.includes('/')) return 'deepseek-chat';
  return m;
}
function loadSettings(){
  const s=localStorage.getItem('sp_settings');
  if(s){try{settings=Object.assign(settings,JSON.parse(s));}catch(e){}}
  settings.apiUrl=normalizeApiUrl(settings.apiUrl);
  settings.modelName=normalizeModelName(settings.modelName);
  const u=document.getElementById('apiUrl'),m=document.getElementById('modelName');
  if(u)u.value=settings.apiUrl;
  if(m)m.value=settings.modelName;
  localStorage.setItem('sp_settings',JSON.stringify(settings));
}
function saveSettings(){settings.apiUrl=normalizeApiUrl(document.getElementById('apiUrl').value);settings.modelName=normalizeModelName(document.getElementById('modelName').value);document.getElementById('apiUrl').value=settings.apiUrl;document.getElementById('modelName').value=settings.modelName;localStorage.setItem('sp_settings',JSON.stringify(settings));document.getElementById('settingsPanel').classList.remove('active');setStatus('已保存',false,true);}

function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('active');}
function showLoading(t){document.getElementById('loadingText').textContent=t||'请稍候...';document.getElementById('loadingMask').classList.add('active');}
function hideLoading(){document.getElementById('loadingMask').classList.remove('active');}
function setStatus(msg,isError,isOk){const bar=document.getElementById('statusBar');bar.textContent=msg;bar.className='status-bar'+(isError?' error':isOk?' ok':'');}

function backHome(){

function nextCase(){document.getElementById('scorePanel').style.display='none';document.getElementById('configBar').style.display='flex';document.getElementById('caseSelect').style.display='block';document.getElementById('caseDisplay').innerHTML='';document.getElementById('prepPhase').style.display='none';document.getElementById('qaPhase').style.display='none';document.getElementById('historySummaryEdit').style.display='none';populateCaseSelect();}

function startMode(mode){

  followUpCount=0; followUpContext=''; followUpQuestion='';
  currentHistoryIndex=-1;
  
  document.getElementById('homePage').style.display='none';document.getElementById('examPage').style.display='block';
  document.getElementById('scorePanel').style.display='none';document.getElementById('submitDiagBtn').style.display='none';document.getElementById('questionBox').style.display='none';
  document.getElementById('caseSelect').style.display='block';
  document.getElementById('caseDisplay').innerHTML='';
  document.getElementById('qaPhase').style.display='none';
  document.getElementById('prepPhase').style.display='none';
  document.getElementById('historySummaryEdit').style.display='none';

    document.getElementById('examTitle').textContent='问诊打分';

      <label>科室：</label><select id="deptSelect" onchange="onConfigChange()"><option value="all">全部</option><option value="内科">内科</option><option value="外科">外科</option><option value="妇科">妇科</option></select>
      <label>难度：</label><select id="diffSelect" onchange="onConfigChange()"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select>
      <label>严格：</label><select id="configStrictness" onchange="onStrictnessChange()"><option value="lenient">宽松</option><option value="medium" selected>中等</option><option value="strict">严格</option></select>

function onStrictnessChange(){settings.strictness=document.getElementById('configStrictness').value;localStorage.setItem('sp_settings',JSON.stringify(settings));}
function onComorbChange(){settings.wantComorbidities=document.getElementById('comorbCheck').checked;settings.wantComplications=document.getElementById('compCheck').checked;localStorage.setItem('sp_settings',JSON.stringify(settings));}

function onConfigChange(){currentDept=document.getElementById('deptSelect').value;currentDifficulty=document.getElementById('diffSelect').value;populateCaseSelect();}

function populateInterviewSelect(){
  const w=document.getElementById('caseSelect');let h='<div class="cs-row"><div><label class="cs-label">病种：</label></div><div><select id="caseDropdown" multiple><option value="" selected>—— 随机 ——</option>';
  for(const[d,list]of Object.entries(EXAM_DISEASES)){h+=`<optgroup label="${d}">`;list.forEach(x=>{h+=`<option value="${x}">${x}</option>`;});h+='</optgroup>';}
  h+='</select></div></div><button onclick="onInterviewGenerateClick()">开始问诊</button>';w.innerHTML=h;
}

function populateCaseSelect(){
  const w=document.getElementById('caseSelect');let h='<div class="cs-row"><div><label class="cs-label">病种：</label></div><div><select id="caseDropdown" multiple><option value="" selected>—— 随机 ——</option>';
  for(const[d,list]of Object.entries(EXAM_DISEASES)){if(currentDept!=='all'&&currentDept!==d)continue;h+=`<optgroup label="${d}">`;list.forEach(x=>{h+=`<option value="${x}">${x}</option>`;});h+='</optgroup>';}
  h+='</select></div></div><button onclick="onGenerateClick()">生成病例</button>';w.innerHTML=h;
}

function getChosenDiseases(){const s=document.getElementById('caseDropdown');if(!s)return[];return Array.from(s.selectedOptions).map(o=>o.value).filter(Boolean);}

async function onInterviewGenerateClick(){
  const c=getChosenDiseases();let d;
  if(!c.length){const a=[];for(const l of Object.values(EXAM_DISEASES))a.push(...l);d=a[Math.floor(Math.random()*a.length)];}else d=c[Math.floor(Math.random()*c.length)];
  currentDisease=d;showLoading('生成...');
  try{currentCase=await generateCaseFromAPI(d);hideLoading();document.getElementById('caseSelect').style.display='none';document.getElementById('caseDisplay').innerHTML=`<div class="case-card"><h3>🩹 问诊：${d}</h3><p style="color:#666;">病例已隐藏，问诊获取信息。</p></div>`;document.getElementById('submitDiagBtn').style.display='inline-block';startInterviewQA();}catch(e){hideLoading();alert(e.message);}
}

async function onGenerateClick(){
  const c=getChosenDiseases();let d;
  if(!c.length){const a=[];for(const l of Object.values(EXAM_DISEASES))a.push(...l);d=a[Math.floor(Math.random()*a.length)];}else if(c.length===1)d=c[0];else d=c[Math.floor(Math.random()*c.length)];
  currentDisease=d;showLoading('生成...');
  try{currentCase=await generateCaseFromAPI(d);hideLoading();renderCaseCard();startPrep();}catch(e){hideLoading();alert(e.message);}
}

function buildCaseGenPrompt(disease){
  const ds=DIAGNOSIS_SET[disease]||{main:disease};
  const parts=[];
  if(settings.wantComorbidities){ parts.push('必须包含1-2个合并症（comorbidities），并在诊断中体现'); }
  if(settings.wantComplications){ parts.push('必须包含1-2个并发症（complications），并在诊断中体现'); }
  const extra=parts.length?('注意：'+parts.join('；')+'。'):'注意：本例不设置合并症与并发症，诊断仅含主要诊断。';
  return `生成病例。病种${disease}。诊断：${ds.main}。含主诉、现病史、查体、辅助检查。${extra}JSON：{"title":"病例","chief_complaint":"","history":"","physical":"","labs":"","diagnosis_checklist":[],"standard_answers":{"诊断":"","依据":"","鉴别":"","治疗":""}}`;
}
async function generateCaseFromAPI(disease){
  const p=buildCaseGenPrompt(disease);
  let r;
  try{
    r=await fetch(settings.apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:settings.modelName,messages:[{role:"user",content:p}]})});
  }catch(e){
    throw new Error('无法连接 AI 接口（'+settings.apiUrl+'）。请点设置，把 API 地址改成 /api/generate 后重试。');
  }
  const rawText=await r.text();
  let d;
  try{d=JSON.parse(rawText);}catch(e){throw new Error('AI 接口返回异常（HTTP '+r.status+'）：'+rawText.slice(0,160));}
  if(!r.ok||(d&&d.error))throw new Error((d&&d.error&&(d.error.message||d.error))||('HTTP '+r.status));
  const content=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
  const cleaned=content.replace(/```json?\s*/gi,'').replace(/```/g,'').trim();
  let result;
  try{result=JSON.parse(cleaned);}catch(e){
    const m=cleaned.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('AI 返回内容无法解析为 JSON：'+cleaned.slice(0,120));
    result=JSON.parse(m[0]);
  }
  result.title='病例';
  return result;
}

function renderCaseCard(){document.getElementById('caseSelect').style.display='none';const d=currentCase;document.getElementById('caseDisplay').innerHTML=`<div class="case-card"><h3>${d.title||'病例'}</h3><div class="case-info"><p><strong>主诉：</strong>${d.chief_complaint}</p><p><strong>现病史：</strong>${d.history}</p><p><strong>查体：</strong>${d.physical}</p><p><strong>辅助检查：</strong>${d.labs}</p></div></div>`;}

function startPrep(){document.getElementById('prepPhase').style.display='block';document.getElementById('qaPhase').style.display='none';prepSeconds=300;currentQuestionIndex=0;studentAnswers=[];followUpCount=0;followUpContext='';followUpQuestion='';updatePrepDisplay();if(prepTimer)clearInterval(prepTimer);prepTimer=setInterval(()=>{prepSeconds--;updatePrepDisplay();if(prepSeconds<=0){clearInterval(prepTimer);startQA();}},1000);}

function updatePrepDisplay(){const m=Math.floor(prepSeconds/60),s=prepSeconds%60;document.getElementById('prepPhase').innerHTML=`<h3>准备时间</h3><div class="countdown">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><button onclick="startQA()" style="margin-top:16px;padding:10px 24px;background:#1677ff;color:#fff;border:none;border-radius:8px;cursor:pointer;">跳过</button>`;}

function startQA(){resetAnswerArea();if(prepTimer){clearInterval(prepTimer);prepTimer=null;}document.getElementById('prepPhase').style.display='none';document.getElementById('qaPhase').style.display='block';document.getElementById('questionBox').style.display='block';document.getElementById('chatHistory').innerHTML='';document.getElementById('transcript').textContent='';initSpeechRecognition();askCurrentQuestion();}

function startInterviewQA(){resetAnswerArea();document.getElementById('prepPhase').style.display='none';document.getElementById('qaPhase').style.display='block';document.getElementById('questionBox').style.display='none';document.getElementById('chatHistory').innerHTML='';interviewHistory=[];initSpeechRecognition();addChatMsg('patient','👋 你好医生，我来看病。');setStatus('问诊中',false,true);}

function askCurrentQuestion(){if(currentQuestionIndex>=QUESTION_SEQUENCE.length){finishExam();return;}const q=QUESTION_SEQUENCE[currentQuestionIndex];document.getElementById('questionText').textContent=q.label+'：'+q.prompt;addChatMsg('examiner',q.label+'：'+q.prompt);}

function addChatMsg(role,text){const div=document.createElement('div');div.className='chat-msg '+role;div.textContent=text;document.getElementById('chatHistory').appendChild(div);document.getElementById('chatHistory').scrollTop=99999;}

loadSettings();initSpeechRecognition();checkMicState();
</script>
